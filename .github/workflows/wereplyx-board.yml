name: WeReplyX board

# Keeps the WeReplyX QA / project board in step with the work on WeReplyX
# (issues of 4BornGithub/wereplyx.com, WeReply-Admin and WeReply).
# Requests (status, comment, add, close/reopen, assign, fields ... see the top of
# .github/scripts/board_ops.py) are written to wereplyx/requests.json on branch "board" of the
# private repository 4BornGithub/WeReply-Admin; this workflow applies them with the
# PROJECTS_TOKEN secret, then saves a copy of the board (wereplyx/board.json, board.md) and the
# outcome (last-run.json, history.json) back there.
# The board is found automatically (the board that holds the most wereplyx.com issues) unless
# BOARD_NUMBER is set below.
# This repository is public: no card or issue text is printed in this log, only counts.
on:
  schedule:
    - cron: "37 */3 * * *"   # every 3 hours: copy of the board only
  push:
    branches: [wereplyx-board]   # a push to this branch applies the requests (the workflow is not on the default branch yet)
    paths: [".github/workflows/wereplyx-board.yml", ".github/scripts/board_ops.py", ".github/wereplyx-run"]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply wereplyx/requests.json (WeReply-Admin, branch board) before copying the board"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: wereplyx-board
  cancel-in-progress: false

env:
  STORE_REPO: 4BornGithub/WeReply-Admin
  STORE_BRANCH: board
  DIR: wereplyx
  BOARD_OWNER: 4BornGithub
  BOARD_NUMBER: ""                          # empty = find it from the issues below
  ISSUE_REPO: 4BornGithub/wereplyx.com      # default repository for "#123" issue refs

jobs:
  board:
    name: apply requests and copy the board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Pick the tokens
        id: tokens
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # Board token: the first secret that can read and write the board owner's projects.
          proj=""
          for name in PROJECTS_TOKEN MULTISPACE_REPO_TOKEN PRIVATE_REPO_TOKEN; do
            tok="${!name:-}"; [ -n "$tok" ] || continue
            ok=$(curl -fsS -H "Authorization: Bearer $tok" -H "Content-Type: application/json" https://api.github.com/graphql \
                   -d "{\"query\":\"{ user(login: \\\"${BOARD_OWNER}\\\") { projectsV2(first: 1) { totalCount } } }\"}" 2>/dev/null \
                 | python3 -c "import json,sys; d=json.load(sys.stdin); print('yes' if not d.get('errors') and (d.get('data') or {}).get('user') else 'no')" 2>/dev/null || echo no)
            echo "$name: can read the board owner's projects = $ok"
            if [ "$ok" = yes ] && [ -z "$proj" ]; then proj="$name"; fi
          done
          [ -n "$proj" ] || { echo "::error::No secret can read the projects of ${BOARD_OWNER}: add PROJECTS_TOKEN (classic token with the project scope)"; exit 1; }
          echo "project=$proj" >> "$GITHUB_OUTPUT"
          # Store token: the first secret that can push to the store repository.
          pick=""
          for name in PRIVATE_REPO_TOKEN PROJECTS_TOKEN MULTISPACE_REPO_TOKEN; do
            tok="${!name:-}"; [ -n "$tok" ] || continue
            push=$(curl -fsS -H "Authorization: Bearer $tok" -H "Accept: application/vnd.github+json" \
                     "https://api.github.com/repos/${STORE_REPO}" 2>/dev/null \
                   | python3 -c "import json,sys; print(json.load(sys.stdin).get('permissions',{}).get('push', False))" 2>/dev/null || echo False)
            echo "$name: can push to the store repository = $push"
            if [ "$push" = "True" ] && [ -z "$pick" ]; then pick="$name"; fi
          done
          [ -n "$pick" ] || { echo "::error::No secret can push to ${STORE_REPO}: give PRIVATE_REPO_TOKEN (or PROJECTS_TOKEN) Contents read/write on it"; exit 1; }
          echo "store=$pick" >> "$GITHUB_OUTPUT"
          echo "Board token: $proj, store token: $pick"

      - name: Find the board
        id: find
        env:
          TOKEN: ${{ secrets[steps.tokens.outputs.project] }}
        run: |
          set -euo pipefail
          if [ -n "$BOARD_NUMBER" ]; then echo "number=$BOARD_NUMBER" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import collections, json, os, sys, urllib.request
          o, n = os.environ["ISSUE_REPO"].split("/")
          q = """query($o: String!, $n: String!) { repository(owner: $o, name: $n) {
                   issues(last: 100) { nodes { projectItems(first: 10) { nodes { project { number owner { ... on User { login } ... on Organization { login } } } } } } } } }"""
          req = urllib.request.Request("https://api.github.com/graphql", data=json.dumps({"query": q, "variables": {"o": o, "n": n}}).encode(),
                                       headers={"Authorization": "Bearer " + os.environ["TOKEN"], "Content-Type": "application/json"})
          d = json.load(urllib.request.urlopen(req, timeout=30))
          if d.get("errors"):
              print("Read errors:", [e.get("type") for e in d["errors"]], file=sys.stderr); sys.exit(1)
          count = collections.Counter()
          for issue in d["data"]["repository"]["issues"]["nodes"]:
              for it in issue["projectItems"]["nodes"]:
                  p = it["project"]
                  if (p.get("owner") or {}).get("login", "").lower() == os.environ["BOARD_OWNER"].lower():
                      count[p["number"]] += 1
          if not count:
              print("None of the last 100 issues is on a board of " + os.environ["BOARD_OWNER"] + ": set BOARD_NUMBER", file=sys.stderr); sys.exit(1)
          number, hits = count.most_common(1)[0]
          print(f"Board found: number {number} ({hits} of the last 100 issues are on it)", file=sys.stderr)
          print(f"number={number}")
          PY

      - name: Get the requests
        env:
          REPO_TOKEN: ${{ secrets[steps.tokens.outputs.store] }}
        run: |
          set -euo pipefail
          URL="https://x-access-token:${REPO_TOKEN}@github.com/${STORE_REPO}.git"
          if git clone -q --depth 1 --branch "$STORE_BRANCH" "$URL" "$RUNNER_TEMP/priv" 2>/dev/null; then :; else
            # First run: the branch does not exist yet (it is created when the results are saved).
            mkdir -p "$RUNNER_TEMP/priv"
          fi
          mkdir -p "$RUNNER_TEMP/priv/$DIR"
          f="$RUNNER_TEMP/priv/$DIR/requests.json"
          [ -f "$f" ] || echo "[]" > "$f"
          cp "$f" "$RUNNER_TEMP/processed.json"
          python3 -c "import json,sys; print('Requests waiting:', len(json.load(open(sys.argv[1]))))" "$f"

      - name: Apply the requests and read the board
        id: ops
        env:
          TOKEN: ${{ secrets[steps.tokens.outputs.project] }}
          BOARD_NUMBER: ${{ steps.find.outputs.number }}
          APPLY: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
        run: |
          set +e
          WORK_DIR="$RUNNER_TEMP/priv/$DIR" python3 .github/scripts/board_ops.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 0 = all fine, 2 = some requests failed (files are still saved), anything else = no board read.
          [ $rc -eq 0 ] || [ $rc -eq 2 ]

      - name: Save into the private repository
        env:
          REPO_TOKEN: ${{ secrets[steps.tokens.outputs.store] }}
          APPLIED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT="$RUNNER_TEMP/priv/$DIR"
          URL="https://x-access-token:${REPO_TOKEN}@github.com/${STORE_REPO}.git"
          cat > "$RUNNER_TEMP/merge.py" <<'PY'
          import json, os, sys
          d, out, applied = sys.argv[1], sys.argv[2], sys.argv[3] == "true"
          if not applied:
              sys.exit(0)
          # Drop only the requests this run handled: new ones written meanwhile stay for the next run.
          done = json.load(open(os.environ["RUNNER_TEMP"] + "/processed.json"))
          path = os.path.join(d, "requests.json")
          now = json.load(open(path)) if os.path.exists(path) else []
          left = list(now)
          for r in done:
              if r in left:
                  left.remove(r)
          json.dump(left, open(path, "w"), indent=1, ensure_ascii=False)
          run = json.load(open(os.path.join(out, "last-run.json")))
          hpath = os.path.join(d, "history.json")
          hist = json.load(open(hpath)) if os.path.exists(hpath) else []
          if run["results"]:
              hist = (hist + [run])[-200:]
          json.dump(hist, open(hpath, "w"), indent=1, ensure_ascii=False)
          json.dump(run, open(os.path.join(d, "last-run.json"), "w"), indent=1, ensure_ascii=False)
          PY
          for try in 1 2 3 4; do
            rm -rf "$RUNNER_TEMP/save" && mkdir -p "$RUNNER_TEMP/save" && cd "$RUNNER_TEMP/save"
            if git clone -q --depth 1 --branch "$STORE_BRANCH" "$URL" . 2>/dev/null; then :; else
              # First save: a branch with only the board files, unrelated to the code branches.
              git init -q -b "$STORE_BRANCH" && git remote add origin "$URL"
            fi
            mkdir -p "$DIR"
            cp "$OUT/board.json" "$OUT/board.md" "$DIR/"
            [ -f "$DIR/requests.json" ] || echo "[]" > "$DIR/requests.json"
            python3 "$RUNNER_TEMP/merge.py" "$DIR" "$OUT" "$APPLIED"
            git add "$DIR"
            if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
            git commit -q -m "WeReplyX board: $([ "$APPLIED" = true ] && echo 'requests applied, ' )copy $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin "$STORE_BRANCH"; then echo "Saved to the private repository"; exit 0; fi
            echo "Push refused (the branch moved), trying again"; cd "$RUNNER_TEMP"; sleep $((try * 3))
          done
          echo "::error::Could not save into the private repository"; exit 1

      - name: Report failed requests
        if: ${{ steps.ops.outputs.rc == '2' }}
        run: |
          echo "::error::Some requests failed: see wereplyx/last-run.json on branch board of the store repository"
          exit 1
