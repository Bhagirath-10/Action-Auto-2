name: iOS Simulator Probe

# Temporary: runs an image-loading probe inside the iOS simulator (no signing, no upload).
on:
  workflow_dispatch:
    inputs:
      app:
        description: App
        type: choice
        options: [pillowo]
      ref:
        description: Branch / commit of the app repo
        required: false
        default: main
      mode:
        description: probe = iOS simulator image probe, curl = plain HTTP check from the runners
        type: choice
        options: [probe, curl, fetch]

permissions:
  contents: read

jobs:
  curl:
    if: inputs.mode == 'curl' || inputs.mode == 'fetch'
    strategy:
      matrix:
        os: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: TBO image from this runner
        run: |
          U='https://www.tboholidays.com//imageresource.aspx?img=FbrGPTrju5e/HYusSxssYNGz+r+daGo8+nI8f2/HFw9QwX+47gOd8n0vhhPU+r1v22zr4Z4wuWt7ut0ptMagq1sRyuJt/Vs2zR3nIT9tti5ZOq51mve3701VR1ig3hTEggqmOmw27Q4zR9dkGjQdqgm9jFp0thxKdo3OzevNDDcXH3LBlIl7Sw=='
          echo "runner IP country: $(curl -s -m 10 https://ipinfo.io/country)"
          for ua in 'Dart/3.14 (dart:io)' 'okhttp/4.12.0' 'Pillowo/38 CFNetwork/3826 Darwin/25.0.0'; do
            echo "CHECK $(curl -s -m 20 -o /dev/null -A "$ua" -w '%{http_code}' "$U") UA=$ua"
          done
          echo "CHECK $(curl -s -m 20 -o /dev/null -w '%{http_code}' https://pillowo.com/img/dest_goa.jpg) pillowo.com image"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false
      - name: Plain Dart
        run: dart run ci/probe/fetch_dart.dart
  probe:
    if: inputs.mode != 'curl'
    runs-on: macos-26
    timeout-minutes: 60
    environment: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.APP_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO }}
          path: src
          persist-credentials: false
          show-progress: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION }}
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl list devices booted
          flutter --version | head -1
      - name: Run probe
        working-directory: src
        run: |
          mkdir -p integration_test && cp ../ci/probe/*_test.dart integration_test/
          flutter pub add 'dev:integration_test:{"sdk":"flutter"}' > /dev/null
          T=image_probe_test.dart
          if [ "${{ inputs.mode }}" = fetch ]; then flutter pub add cupertino_http http > /dev/null; T=fetch_probe_test.dart; fi
          flutter test integration_test/$T -d "$UDID" 2>&1 | tee "$RUNNER_TEMP/probe.log" | grep -E 'PROBE|Error|error:|FAIL|passed|failed' || true
      - name: Summary
        if: always()
        run: grep 'PROBE' "$RUNNER_TEMP/probe.log" || tail -n 60 "$RUNNER_TEMP/probe.log" || true
