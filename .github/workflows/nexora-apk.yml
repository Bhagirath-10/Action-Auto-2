name: Nexora AI - test apps (APK) for people

# Builds the Nexora AI test apps from the private repository and publishes them as a release
# of that PRIVATE repository (never here). Runs when nexora-apk.txt changes; its first line is
# the app branch. Separate from the emulator test so both can run at the same time.

on:
  push:
    branches: [ci]
    paths:
      - nexora-apk.txt
      - .github/workflows/nexora-apk.yml

permissions:
  contents: read

concurrency:
  group: nexora-apk
  cancel-in-progress: false

env:
  APP_REPO: 4BornGithub/Nexora_AI

jobs:
  apk:
    name: build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Which branch
        id: what
        run: |
          read -r APP REST < nexora-apk.txt
          echo "$APP" | grep -Eq '^[A-Za-z0-9._/-]{1,80}$' || { echo "::error::nexora-apk.txt: the branch is not valid"; exit 1; }
          echo "app_ref=$APP" >> "$GITHUB_OUTPUT"
      # Only the names of the secrets are printed, never a token.
      - name: Pick a token for the private repository
        id: pick
        env:
          NEXORA_REPO_TOKEN: ${{ secrets.NEXORA_REPO_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          for n in NEXORA_REPO_TOKEN PRIVATE_REPO_TOKEN MULTISPACE_REPO_TOKEN; do
            v="${!n}"; [ -n "$v" ] || continue
            if git ls-remote "https://x-access-token:$v@github.com/$APP_REPO.git" HEAD >/dev/null 2>&1; then echo "name=$n" >> "$GITHUB_OUTPUT"; echo "using $n"; exit 0; fi
          done
          echo "::error::No token secret can read the private repository."; exit 1
      - name: Checkout the app (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ steps.what.outputs.app_ref }}
          token: ${{ secrets[steps.pick.outputs.name] }}
          path: app-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: mkdir -p "$RUNNER_TEMP/out" && bash app-src/tools/ci/build.sh "$RUNNER_TEMP/out"
      - name: Publish the test apps (private release)
        env:
          TOKEN: ${{ secrets[steps.pick.outputs.name] }}
        run: |
          set -euo pipefail
          TAG="test-$(date -u +%Y%m%d-%H%M)"
          SHA="$(git -C app-src rev-parse --short HEAD)"
          BODY=$(jq -n --arg t "$TAG" --arg b "Test build of branch ${{ steps.what.outputs.app_ref }} ($SHA). Debug build: on the sign-in screen tap \"Test build. Server\" to set the test server address." '{tag_name:$t, name:$t, body:$b, prerelease:true, target_commitish:"main"}')
          R=$(curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$APP_REPO/releases" -d "$BODY")
          ID=$(echo "$R" | jq -r '.id')
          [ "$ID" != "null" ] || { echo "::error::The release was not made"; echo "$R" | jq -r '.message'; exit 1; }
          for f in app practice; do
            N="nexora-ai-$f-debug.apk"; [ $f = practice ] && N="nexora-practice-debug.apk"
            curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$RUNNER_TEMP/out/$f.apk" "https://uploads.github.com/repos/$APP_REPO/releases/$ID/assets?name=$N" | jq -r '.name // .message'
          done
          echo "PASS published the test apps (private release $TAG)" | tee -a "$RUNNER_TEMP/out/public.txt"
          rm -f "$RUNNER_TEMP/out/app.apk" "$RUNNER_TEMP/out/practice.apk"

