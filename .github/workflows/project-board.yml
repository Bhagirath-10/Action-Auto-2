name: Project board (read and update through the private tokens)

# Reads (and, when asked, updates) the GitHub Project boards of the project's owners with the token
# secrets (PRIVATE_REPO_TOKEN, MULTISPACE_REPO_TOKEN, NEXORA_REPO_TOKEN). The board's contents are saved
# to the private repository only (4BornGithub/4B-Multi-Space, branch claude/gracious-pasteur-xvuoe4-board);
# this public log shows only which token can see which board, never items.
# project-board.txt: first line "<mode>" (probe | items <owner> <number> | add <owner> <number> <repo> <issue> |
#   comment <repo> <issue> | issue <repo>); the rest of the file is used by the mode (title/body lines).

on:
  push:
    branches: [claude/gracious-pasteur-xvuoe4]
    paths:
      - project-board.txt
      - .github/workflows/project-board.yml

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Board
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
          NEXORA_REPO_TOKEN: ${{ secrets.NEXORA_REPO_TOKEN }}
        run: |
          set -uo pipefail
          O="$RUNNER_TEMP/out"; mkdir -p "$O"
          read -r MODE A1 A2 A3 A4 _ < project-board.txt || true
          gql() { curl -sS -m 30 -H "Authorization: bearer $1" -H "Content-Type: application/json" https://api.github.com/graphql -d "$2"; }
          OWNERS="Bhagirath-10 4BornGithub Bhautik-4B"
          for n in PRIVATE_REPO_TOKEN MULTISPACE_REPO_TOKEN NEXORA_REPO_TOKEN; do
            v="${!n}"; [ -n "$v" ] || { echo "$n: not set"; continue; }
            who=$(gql "$v" '{"query":"{ viewer { login } }"}' | jq -r '.data.viewer.login // "?"')
            echo "$n: works as a GitHub account: $([ "$who" != "?" ] && echo yes || echo no)"
            scopes=$(curl -sSI -m 20 -H "Authorization: token $v" https://api.github.com/user | grep -i '^x-oauth-scopes:' | cut -d: -f2- | tr -d '\r')
            echo "$n: classic scopes include project: $(echo "$scopes" | grep -qw project && echo yes || echo 'no/unknown')"
            for o in $OWNERS; do
              for kind in user organization; do
                q=$(jq -nc --arg o "$o" --arg k "$kind" '{query:("{ " + $k + "(login: \"" + $o + "\") { projectsV2(first: 20) { nodes { number title url closed } } } }")}')
                r=$(gql "$v" "$q")
                cnt=$(echo "$r" | jq -r "(.data.$kind.projectsV2.nodes // []) | length" 2>/dev/null || echo 0)
                if [ "${cnt:-0}" -gt 0 ]; then
                  echo "$n: $kind $o: $cnt board(s) visible"
                  echo "$r" | jq ".data.$kind.projectsV2.nodes" > "$O/projects-$n-$o.json"
                fi
              done
            done
          done
          if [ "$MODE" = items ]; then
            for n in PRIVATE_REPO_TOKEN MULTISPACE_REPO_TOKEN NEXORA_REPO_TOKEN; do
              v="${!n}"; [ -n "$v" ] || continue
              for kind in user organization; do
                q=$(jq -nc --arg o "$A1" --argjson num "$A2" --arg k "$kind" '{query:("{ " + $k + "(login: \"" + $o + "\") { projectV2(number: " + ($num|tostring) + ") { title fields(first:30){ nodes { ... on ProjectV2FieldCommon { name } ... on ProjectV2SingleSelectField { name options { name } } } } items(first: 100) { nodes { id type fieldValues(first: 20) { nodes { ... on ProjectV2ItemFieldTextValue { text field { ... on ProjectV2FieldCommon { name } } } ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2FieldCommon { name } } } ... on ProjectV2ItemFieldDateValue { date field { ... on ProjectV2FieldCommon { name } } } } } content { ... on Issue { number title state url repository { nameWithOwner } body } ... on PullRequest { number title state url } ... on DraftIssue { title body } } } } } } }")}')
                r=$(gql "$v" "$q")
                if echo "$r" | jq -e ".data.$kind.projectV2.title" >/dev/null 2>&1; then
                  echo "$r" > "$O/items-$A1-$A2.json"; echo "items of board $A2 read with $n ($(echo "$r" | jq ".data.$kind.projectV2.items.nodes | length") items)"; break 2
                fi
              done
            done
          fi
          if [ "$MODE" = apply ]; then
            # apply <owner> <number> <repo>: the plan (plan.json) is read from the private branch; each op:
            # {op:create,title,body,status} | {op:comment,issue,body} | {op:status,issue,status}.
            T="$MULTISPACE_REPO_TOKEN"; P="$RUNNER_TEMP/plan"
            git clone -q --depth 1 --branch claude/gracious-pasteur-xvuoe4-board "https://x-access-token:$T@github.com/4BornGithub/4B-Multi-Space.git" "$P" 2>/dev/null
            [ -f "$P/plan.json" ] || { echo "::error::no plan"; exit 1; }
            R="$A3"; echo "$R" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' || { echo "::error::bad repo"; exit 1; }
            q=$(jq -nc --arg o "$A1" --argjson num "$A2" '{query:("{ user(login: \"" + $o + "\") { projectV2(number: " + ($num|tostring) + ") { id field(name: \"Status\") { ... on ProjectV2SingleSelectField { id options { id name } } } } } }")}')
            meta=$(gql "$T" "$q"); PID=$(echo "$meta" | jq -r '.data.user.projectV2.id'); FID=$(echo "$meta" | jq -r '.data.user.projectV2.field.id')
            [ "$PID" != null ] || { echo "::error::board not found"; exit 1; }
            api() { curl -sS -m 30 -H "Authorization: token $T" -H "Accept: application/vnd.github+json" "$@"; }
            # Titles already there (no duplicates on a re-run).
            : > "$O/titles.txt"; for pg in 1 2 3 4; do api "https://api.github.com/repos/$R/issues?state=all&per_page=100&page=$pg" | jq -r '.[] | select(.pull_request == null) | "\(.number)\t\(.title)"' >> "$O/titles.txt"; done
            setstatus() { # itemId statusName
              opt=$(echo "$meta" | jq -r --arg n "$2" '.data.user.projectV2.field.options[] | select(.name == $n) | .id')
              [ -n "$opt" ] || { echo "no status $2"; return; }
              m=$(jq -nc --arg p "$PID" --arg i "$1" --arg f "$FID" --arg o "$opt" '{query:"mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){ updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){ projectV2Item { id } } }",variables:{p:$p,i:$i,f:$f,o:$o}}')
              gql "$T" "$m" | jq -c '.errors // "ok"'
            }
            additem() { # contentNodeId -> itemId
              m=$(jq -nc --arg p "$PID" --arg c "$1" '{query:"mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item { id } } }",variables:{p:$p,c:$c}}')
              gql "$T" "$m" | jq -r '.data.addProjectV2ItemById.item.id'
            }
            n=$(jq length "$P/plan.json"); done=0
            for i in $(seq 0 $((n-1))); do
              op=$(jq -r ".[$i].op" "$P/plan.json")
              if [ "$op" = create ]; then
                title=$(jq -r ".[$i].title" "$P/plan.json")
                if cut -f2- "$O/titles.txt" | grep -qxF "$title"; then
                  num=$(awk -F'\t' -v t="$title" '$2==t{print $1; exit}' "$O/titles.txt"); echo "skip $num (there)" >> "$O/result.txt"; continue
                fi
                body=$(jq -c ".[$i] | {title, body}" "$P/plan.json")
                res=$(api -X POST "https://api.github.com/repos/$R/issues" -d "$body")
                num=$(echo "$res" | jq -r .number); node=$(echo "$res" | jq -r .node_id)
                [ "$num" != null ] || { echo "create failed: $(echo "$res" | jq -r .message)" >> "$O/result.txt"; continue; }
                item=$(additem "$node"); st=$(jq -r ".[$i].status" "$P/plan.json")
                echo "created #$num item $item status $st: $(setstatus "$item" "$st")" >> "$O/result.txt"; done=$((done+1))
              elif [ "$op" = comment ]; then
                num=$(jq -r ".[$i].issue" "$P/plan.json"); body=$(jq -c ".[$i] | {body}" "$P/plan.json")
                api -X POST "https://api.github.com/repos/$R/issues/$num/comments" -d "$body" | jq -r '"comment #'"$num"': \(.id // .message)"' >> "$O/result.txt"; done=$((done+1))
              elif [ "$op" = move ]; then
                # Every card in status `from` -> `to` (all pages of the board), except the issues in `exclude`.
                from=$(jq -r ".[$i].from" "$P/plan.json"); to=$(jq -r ".[$i].to" "$P/plan.json"); excl=$(jq -c ".[$i].exclude // []" "$P/plan.json")
                after=null; moved=0
                while :; do
                  q=$(jq -nc --arg p "$PID" --argjson a "$after" '{query:"query($p:ID!,$a:String){ node(id:$p){ ... on ProjectV2 { items(first:100, after:$a){ pageInfo{ hasNextPage endCursor } nodes{ id fieldValueByName(name:\"Status\"){ ... on ProjectV2ItemFieldSingleSelectValue{ name } } content{ ... on Issue{ number } } } } } } }",variables:{p:$p,a:$a}}')
                  page=$(gql "$T" "$q")
                  for row in $(echo "$page" | jq -r --arg f "$from" --argjson x "$excl" '.data.node.items.nodes[] | select(.fieldValueByName.name == $f) | select((.content.number // -1) as $n | ($x | index($n)) | not) | "\(.id),\(.content.number // "draft")"'); do
                    id=${row%%,*}; num=${row#*,}
                    echo "move #$num $from -> $to: $(setstatus "$id" "$to")" >> "$O/result.txt"; moved=$((moved+1))
                  done
                  [ "$(echo "$page" | jq -r '.data.node.items.pageInfo.hasNextPage')" = true ] || break
                  after=$(echo "$page" | jq -c '.data.node.items.pageInfo.endCursor')
                done
                echo "moved $moved card(s)" >> "$O/result.txt"; done=$((done+1))
              elif [ "$op" = status ]; then
                num=$(jq -r ".[$i].issue" "$P/plan.json"); st=$(jq -r ".[$i].status" "$P/plan.json")
                node=$(api "https://api.github.com/repos/$R/issues/$num" | jq -r .node_id); item=$(additem "$node")
                echo "status #$num -> $st: $(setstatus "$item" "$st")" >> "$O/result.txt"; done=$((done+1))
              fi
            done
            echo "plan applied: $done of $n op(s) done (details in the private repo)"
          fi
          ls -la "$O"
      - name: Save to the private repository
        if: always()
        env:
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
        run: |
          T="$MULTISPACE_REPO_TOKEN"; B=claude/gracious-pasteur-xvuoe4-board
          D="$RUNNER_TEMP/res"; git clone -q --depth 1 --branch "$B" "https://x-access-token:$T@github.com/4BornGithub/4B-Multi-Space.git" "$D" 2>/dev/null || { git init -q "$D"; git -C "$D" checkout -q -b "$B"; git -C "$D" remote add origin "https://x-access-token:$T@github.com/4BornGithub/4B-Multi-Space.git"; }
          R="board-${GITHUB_RUN_ID}"; mkdir -p "$D/$R"; cp -r "$RUNNER_TEMP/out/." "$D/$R/" 2>/dev/null || true
          cd "$D" && git add -A && git -c user.name=board -c user.email=ci@localhost commit -q -m "Board $GITHUB_RUN_ID" && git push -q origin "HEAD:$B" 2>&1 | grep -v -i "token\|x-access" || true
          echo "Saved: $B/$R"
