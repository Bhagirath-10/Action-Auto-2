name: Rummy Home - all accounts at one table (Android on ARM, NEXORA Space)

# The phone app's Rummy automation run for real on a test Android (Redroid on GitHub's ARM runner) with the
# owner's own exported copies: the app is built from a branch of the private repository (the bot's logic
# built in), NEXORA Space is built with its test hook (copies imported by command), the export is imported,
# and Rummy is started with all the copies at a time. Screens and logs go to the private repository only;
# this log shows PASS / FAIL / INFO lines without names, IDs or balances.
# Starts when rummy-table.txt changes. Its lines:
#   app <branch of the app's private repository>
#   space <branch of NEXORA Space's private repository>
#   files <branch of the app's private repository with the test's files (export parts, Rummy Home, script)>
#   run <copies at a time> <minutes> <games per guest> [<main ID> <stagger ms> <loss cap> <one look> <read scale> <0.04 row> <wave wait ms>]
#     (1 to 4 run lines: each is a leg, its own cloud Android with its own accounts, all at the same time)
#   screen <width> <height> <dpi>   (optional; default 1600 720 240)
#   accounts new <N>   (optional: no export, the app makes N new-guest copies itself)
#   survey   (optional: photograph the table lists only)
#   tab best2 <fee>, wavesmax <n>, only <clone,clone>, take <n>   (optional: Best Of 2 at that fee, tries at most, only these copies)
# Secrets (only their names are printed): PRIVATE_REPO_TOKEN / MULTISPACE_REPO_TOKEN / NEXORA_REPO_TOKEN read
# the private repositories; RUMMY_EXPORT_PW is the export file's password.
# The APKs go from the build jobs to the test job as artifacts ENCRYPTED with a key made from a secret
# (this repository is public: nothing readable is ever uploaded). Each APK is built once per commit of its branch:
# the encrypted build is kept in the Actions cache under that commit and taken from it while the branch is unchanged.

on:
  push:
    branches: [claude/fervent-goldberg-8ezvbs]
    paths:
      - rummy-table.txt
      - .github/workflows/rummy-table.yml

permissions:
  contents: read

concurrency:
  group: rummy-table
  cancel-in-progress: true

env:
  APP_REPO: Bhagirath-10/Game-Auto-2
  SPACE_REPO: 4BornGithub/4B-Multi-Space

jobs:
  app:
    name: Build the app (logic built in)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: What to build
        id: what
        run: |
          REF="$(sed -n 's/^app  *//p' rummy-table.txt | head -1)"
          echo "$REF" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || { echo "::error::not a valid branch"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - name: Pick a token
        id: token
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
          NEXORA_REPO_TOKEN: ${{ secrets.NEXORA_REPO_TOKEN }}
          REF: ${{ steps.what.outputs.ref }}
        run: |
          for n in PRIVATE_REPO_TOKEN MULTISPACE_REPO_TOKEN NEXORA_REPO_TOKEN; do
            v="${!n}"; [ -n "$v" ] || { echo "$n: not set"; continue; }
            if git ls-remote --exit-code "https://x-access-token:$v@github.com/$APP_REPO.git" "refs/heads/$REF" >/dev/null 2>&1; then
              echo "Using $n"; echo "name=$n" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "::error::No token secret reads the app's branch"; exit 1
      - name: Its commit (a build is kept per commit)
        id: ver
        env:
          T: ${{ secrets[steps.token.outputs.name] }}
          REF: ${{ steps.what.outputs.ref }}
        run: |
          SHA="$(git ls-remote "https://x-access-token:$T@github.com/$APP_REPO.git" "refs/heads/$REF" | cut -c1-40)"
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::the branch's commit is not read"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "commit ${SHA:0:8}"
      - name: The build kept for this commit
        id: kept
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/app.apk.enc
          key: app-enc-v1-${{ steps.ver.outputs.sha }}
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ steps.what.outputs.ref }}
          token: ${{ secrets[steps.token.outputs.name] }}
          path: a
          persist-credentials: false
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          # This workflow runs on a branch that is not the default one: Gradle's cache is written here too, so a
          # build after a small change of the logic does not start cold.
          cache-read-only: false
      - name: Build (full flavor, no backend)
        if: steps.kept.outputs.cache-hit != 'true'
        working-directory: a/android-app
        env:
          VERSION_CODE: "20115"
          BACKEND_URL: ""
          LOGIC_FLOOR: "0"
        run: |
          export VERSION_NAME="2.1.15-table${GITHUB_RUN_NUMBER}"
          if ! gradle --no-daemon --console=plain assembleFullRelease >"$RUNNER_TEMP/build_log.txt" 2>&1; then
            grep -E "^e: |error:|What went wrong|FAILED" -A3 "$RUNNER_TEMP/build_log.txt" | head -60
            echo "::error::the app did not build"; exit 1
          fi
          cp app/build/outputs/apk/full/release/app-full-release.apk "$RUNNER_TEMP/app.apk"
          echo "PASS app built ($(stat -c %s "$RUNNER_TEMP/app.apk") bytes, $(git -C .. rev-parse --short HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Encrypt for the test job
        if: steps.kept.outputs.cache-hit != 'true'
        env:
          K: ${{ secrets.PRIVATE_REPO_TOKEN }}${{ secrets.MULTISPACE_REPO_TOKEN }}${{ secrets.NEXORA_REPO_TOKEN }}
        run: |
          KEY="$(printf '%s' "$K" | sha256sum | cut -c1-64)" openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KEY -in "$RUNNER_TEMP/app.apk" -out "$RUNNER_TEMP/app.apk.enc"
      - name: Keep this build for its commit
        if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/app.apk.enc
          key: app-enc-v1-${{ steps.ver.outputs.sha }}
      - name: Kept build used
        if: steps.kept.outputs.cache-hit == 'true'
        run: echo "PASS app not built again (commit ${{ steps.ver.outputs.sha }} was built before)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: app-enc
          path: ${{ runner.temp }}/app.apk.enc
          retention-days: 1
    outputs:
      token: ${{ steps.token.outputs.name }}

  space:
    name: Build NEXORA Space (test hook)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: What to build
        id: what
        run: |
          REF="$(sed -n 's/^space  *//p' rummy-table.txt | head -1)"
          echo "$REF" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || { echo "::error::not a valid branch"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - name: Pick a token
        id: token
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
          NEXORA_REPO_TOKEN: ${{ secrets.NEXORA_REPO_TOKEN }}
          REF: ${{ steps.what.outputs.ref }}
        run: |
          for n in MULTISPACE_REPO_TOKEN PRIVATE_REPO_TOKEN NEXORA_REPO_TOKEN; do
            v="${!n}"; [ -n "$v" ] || { echo "$n: not set"; continue; }
            if git ls-remote --exit-code "https://x-access-token:$v@github.com/$SPACE_REPO.git" "refs/heads/$REF" >/dev/null 2>&1; then
              echo "Using $n"; echo "name=$n" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "::error::No token secret reads NEXORA Space's branch"; exit 1
      - name: Its commit (a build is kept per commit)
        id: ver
        env:
          T: ${{ secrets[steps.token.outputs.name] }}
          REF: ${{ steps.what.outputs.ref }}
        run: |
          SHA="$(git ls-remote "https://x-access-token:$T@github.com/$SPACE_REPO.git" "refs/heads/$REF" | cut -c1-40)"
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::the branch's commit is not read"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "commit ${SHA:0:8}"
      - name: The build kept for this commit
        id: kept
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/space.apk.enc
          key: space-enc-v1-${{ steps.ver.outputs.sha }}
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SPACE_REPO }}
          ref: ${{ steps.what.outputs.ref }}
          token: ${{ secrets[steps.token.outputs.name] }}
          path: s
          persist-credentials: false
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          # This workflow runs on a branch that is not the default one: Gradle's cache is written here too, so a
          # build after a small change of the logic does not start cold.
          cache-read-only: false
      - name: Build (release, test key, QA, test hook)
        if: steps.kept.outputs.cache-hit != 'true'
        working-directory: s
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066" >/dev/null
          if ! gradle --no-daemon --console=plain -PversionCode=10113 -PversionName=1.1.13 -Pqa=true -Pe2e=true :app:assembleRelease >"$RUNNER_TEMP/build_log.txt" 2>&1; then
            grep -E "^e: |error:|What went wrong|FAILED" -A3 "$RUNNER_TEMP/build_log.txt" | head -60
            echo "::error::NEXORA Space did not build"; exit 1
          fi
          cp "$(ls app/build/outputs/apk/release/*universal*.apk | head -1)" "$RUNNER_TEMP/space.apk"
          echo "PASS NEXORA Space built ($(stat -c %s "$RUNNER_TEMP/space.apk") bytes, $(git rev-parse --short HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Encrypt for the test job
        if: steps.kept.outputs.cache-hit != 'true'
        env:
          K: ${{ secrets.PRIVATE_REPO_TOKEN }}${{ secrets.MULTISPACE_REPO_TOKEN }}${{ secrets.NEXORA_REPO_TOKEN }}
        run: |
          KEY="$(printf '%s' "$K" | sha256sum | cut -c1-64)" openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KEY -in "$RUNNER_TEMP/space.apk" -out "$RUNNER_TEMP/space.apk.enc"
      - name: Keep this build for its commit
        if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/space.apk.enc
          key: space-enc-v1-${{ steps.ver.outputs.sha }}
      - name: Kept build used
        if: steps.kept.outputs.cache-hit == 'true'
        run: echo "PASS space not built again (commit ${{ steps.ver.outputs.sha }} was built before)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: space-enc
          path: ${{ runner.temp }}/space.apk.enc
          retention-days: 1

  plan:
    name: The legs (one cloud Android a "run" line)
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.p.outputs.legs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: p
        run: |
          N=$(grep -cE '^run ' rummy-table.txt); [ "$N" -ge 1 ] && [ "$N" -le 4 ] || { echo "::error::1 to 4 run lines"; exit 1; }
          echo "legs=[$(seq -s, 1 "$N")]" >> "$GITHUB_OUTPUT"; echo "$N leg(s)"

  test:
    name: Rummy leg ${{ matrix.leg }}
    needs: [app, space, plan]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    env:
      LEG: ${{ matrix.leg }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: What to test
        id: what
        run: |
          REF="$(sed -n 's/^files  *//p' rummy-table.txt | head -1)"
          echo "$REF" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || { echo "::error::not a valid branch"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          read -r _ AT MIN GAMES MAIN STAG LOSS ONE SCALE ROW WW _ <<< "$(grep -E '^run ' rummy-table.txt | sed -n "${LEG}p")"
          [ -z "$ROW" ] || echo "$ROW" | grep -Eq '^[12]$' || { echo "::error::the row is 1 or 2"; exit 1; }
          [ -z "$WW" ] || echo "$WW" | grep -Eq '^[0-9]{1,6}$' || { echo "::error::the wave's wait is ms"; exit 1; }
          echo "RM_WAVEWAIT=$WW" >> "$GITHUB_ENV"
          echo "RM_ROW=$ROW" >> "$GITHUB_ENV"; echo "leg $LEG: $(grep -E '^run ' rummy-table.txt | sed -n "${LEG}p")"
          [ -z "$SCALE" ] || echo "$SCALE" | grep -Eq '^[0-9.]{1,4}$' || { echo "::error::not a scale"; exit 1; }
          echo "RM_OCRSCALE=$SCALE" >> "$GITHUB_ENV"
          [ -z "$STAG" ] || echo "$STAG" | grep -Eq '^[0-9,]{1,40}$' || { echo "::error::not a stagger list"; exit 1; }
          [ -z "$LOSS" ] || echo "$LOSS" | grep -Eq '^[0-9.]{1,5}$' || { echo "::error::not an amount"; exit 1; }
          echo "RM_STAGGER=$STAG" >> "$GITHUB_ENV"; echo "RM_LOSSMAX=$LOSS" >> "$GITHUB_ENV"; echo "RM_ONELOOK=${ONE:-0}" >> "$GITHUB_ENV"
          for v in "$AT" "$MIN" "$GAMES"; do echo "$v" | grep -Eq '^[0-9]{1,3}$' || { echo "::error::not a number"; exit 1; }; done
          [ -z "$MAIN" ] || echo "$MAIN" | grep -Eq '^[A-Za-z0-9@]{1,20}$' || { echo "::error::not a main ID"; exit 1; }
          echo "RM_AT=$AT" >> "$GITHUB_ENV"; echo "RM_MIN=$MIN" >> "$GITHUB_ENV"; echo "RM_GAMES=$GAMES" >> "$GITHUB_ENV"; echo "RM_MAIN=${MAIN:-@1}" >> "$GITHUB_ENV"
          # "accounts new <N>": no export, the app makes N new-guest copies itself; none: the export's copies.
          read -r _ ACC NEW _ <<< "$(grep -E '^accounts ' rummy-table.txt | head -1)"
          case "${ACC:-space}" in space|new) ;; *) echo "::error::accounts is space or new"; exit 1;; esac
          [ -z "$NEW" ] || echo "$NEW" | grep -Eq '^[0-9]{1,2}$' || { echo "::error::not a number"; exit 1; }
          echo "RM_ACCOUNTS=${ACC:-space}" >> "$GITHUB_ENV"; echo "RM_NEW=${NEW:-$AT}" >> "$GITHUB_ENV"
          # "survey": the account photographs Rummy Home's table lists and ends (nothing is played).
          grep -qE '^survey' rummy-table.txt && echo "RM_SURVEY=1" >> "$GITHUB_ENV" || true
          # "tab best2 <fee>": the Best Of 2 tables at that entry fee; "wavesmax <n>": tries at most; "only <clones>": only these copies.
          read -r _ TAB FEE _ <<< "$(grep -E '^tab ' rummy-table.txt | head -1)"
          if [ -n "$TAB" ]; then echo "$TAB" | grep -Eq '^best2$' && echo "$FEE" | grep -Eq '^[0-9]{1,5}$' || { echo "::error::tab best2 <fee>"; exit 1; }; echo "RM_TAB=$TAB" >> "$GITHUB_ENV"; echo "RM_ENTRY=$FEE" >> "$GITHUB_ENV"; fi
          read -r _ WM _ <<< "$(grep -E '^wavesmax ' rummy-table.txt | head -1)"
          if [ -n "$WM" ]; then echo "$WM" | grep -Eq '^[0-9]{1,2}$' || { echo "::error::wavesmax <n>"; exit 1; }; echo "RM_WAVESMAX=$WM" >> "$GITHUB_ENV"; fi
          read -r _ ONLY _ <<< "$(grep -E '^only ' rummy-table.txt | head -1)"
          if [ -n "$ONLY" ]; then echo "$ONLY" | grep -Eq '^[0-9,]{1,60}$' || { echo "::error::only <clone numbers>"; exit 1; }; echo "RM_ONLY=$ONLY" >> "$GITHUB_ENV"; fi
          read -r _ TAKE _ <<< "$(grep -E '^take ' rummy-table.txt | head -1)"
          if [ -n "$TAKE" ]; then echo "$TAKE" | grep -Eq '^[0-9]{1,2}$' || { echo "::error::take <n>"; exit 1; }; echo "RM_TAKE=$TAKE" >> "$GITHUB_ENV"; fi
      - name: The test's files (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ steps.what.outputs.ref }}
          token: ${{ secrets[needs.app.outputs.token] }}
          path: x
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/art
      - name: Decrypt the APKs
        env:
          K: ${{ secrets.PRIVATE_REPO_TOKEN }}${{ secrets.MULTISPACE_REPO_TOKEN }}${{ secrets.NEXORA_REPO_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          export KEY="$(printf '%s' "$K" | sha256sum | cut -c1-64)"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY -in art/app-enc/app.apk.enc -out app.apk
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY -in art/space-enc/space.apk.enc -out space.apk
          cat "$GITHUB_WORKSPACE"/x/e2e/export.4bspace.part* > export.4bspace
          [ "$(sha256sum export.4bspace | cut -c1-64)" = "$(cat "$GITHUB_WORKSPACE/x/e2e/export.sha256")" ] && echo "PASS the export file is whole" || { echo "::error::the export file is not whole"; exit 1; }
      - name: Start Android (Redroid, arm64)
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq adb aapt "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || sudo apt-get install -y -qq adb aapt >/dev/null
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe ashmem_linux 2>/dev/null || true
          echo "runner: $(nproc) CPUs, $(free -g | awk '/Mem/{print $2}') GB"
          # The screen: "screen W H DPI" in rummy-table.txt (default 1600 720 240; the app's taps scale from 1600x720).
          read -r _ SW SH SD _ <<< "$(grep -E '^screen ' rummy-table.txt | head -1)"
          SW="${SW:-1600}"; SH="${SH:-720}"; SD="${SD:-240}"; echo "screen ${SW}x${SH} at ${SD} dpi"
          IMG="redroid/redroid:12.0.0_64only-latest"
          docker pull -q "$IMG" >/dev/null
          docker run -d --name android1 --privileged --memory=13g -p 6001:5555 "$IMG" \
            androidboot.redroid_gpu_mode=guest androidboot.use_memfd=true androidboot.redroid_width=$SW androidboot.redroid_height=$SH androidboot.redroid_dpi=$SD androidboot.redroid_fps=15 >/dev/null
          for t in $(seq 1 84); do adb connect localhost:6001 >/dev/null 2>&1; [ "$(adb -s localhost:6001 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 5; done
          [ "$(adb -s localhost:6001 shell getprop sys.boot_completed | tr -d '\r')" = 1 ] || { echo "::error::Android did not boot"; exit 1; }
          echo "PASS Android booted ($(adb -s localhost:6001 shell getprop ro.build.version.release | tr -d '\r'))"
          mkdir -p "$RUNNER_TEMP/sdk/build-tools/0" && ln -sf "$(command -v aapt)" "$RUNNER_TEMP/sdk/build-tools/0/aapt"; echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Rummy, all the copies at a time
        env:
          EXPORT_PW: ${{ secrets.RUMMY_EXPORT_PW }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
          NEXORA_REPO_TOKEN: ${{ secrets.NEXORA_REPO_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          # Live progress (every 3 minutes): the test's log, the runs' logs so far and the last screens, to a private
          # branch (e2e/one-table-live-<leg>, one commit, replaced each time). Nothing of it in this log.
          LU=""
          for n in MULTISPACE_REPO_TOKEN PRIVATE_REPO_TOKEN NEXORA_REPO_TOKEN; do
            v="${!n}"; [ -n "$v" ] || continue
            git ls-remote "https://x-access-token:$v@github.com/$APP_REPO.git" >/dev/null 2>&1 && { LU="https://x-access-token:$v@github.com/$APP_REPO.git"; break; }
          done
          live() {
            set +e
            [ -n "$LU" ] || return 0
            D="$RUNNER_TEMP/live"; rm -rf "$D"; mkdir -p "$D/screens"
            cp "$OUT/phone1/log.txt" "$OUT/phone1/public.txt" "$D/" 2>/dev/null
            cp -r "$OUT/phone1/live" "$D/" 2>/dev/null
            ls -t "$OUT"/phone1/screens/*.png 2>/dev/null | head -6 | while read -r f; do convert "$f" -resize 50% -quality 60 "$D/screens/$(basename "${f%.png}").jpg" 2>/dev/null || cp "$f" "$D/screens/"; done
            (cd "$D" && git init -q && git checkout -q -b "e2e/one-table-live-$LEG" && git add -A && git -c user.name=rummy-table -c user.email=e2e@localhost commit -q -m "live $GITHUB_RUN_ID $(date -u +%H:%M)" && git push -q -f "$LU" "HEAD:e2e/one-table-live-$LEG" >/dev/null 2>&1) || true
          }
          ( set +e; while sleep 180; do live; done ) & LIVE=$!
          WAIT_SEC=$((RM_MIN * 60)) bash x/scripts/test_table.sh localhost:6001 "$RUNNER_TEMP/space.apk" x/e2e/rummyhome.apk "$RUNNER_TEMP/app.apk" "$RUNNER_TEMP/export.4bspace" "$OUT/phone1" > "$OUT/console1.txt" 2>&1; RC=$?
          kill $LIVE 2>/dev/null; live
          { echo "### result"; echo '```'; cat "$OUT/phone1/public.txt" 2>/dev/null || echo "no result"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          docker logs android1 > "$OUT/redroid1.txt" 2>&1 || true
          echo "RC=$RC" >> "$GITHUB_ENV"
      - name: Save the results to a private repository
        if: always()
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
          NEXORA_REPO_TOKEN: ${{ secrets.NEXORA_REPO_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/out" 2>/dev/null || exit 0
          find . -name '*.png' -size +0 | while read -r f; do (command -v convert >/dev/null && convert "$f" -resize 50% -quality 60 "${f%.png}.jpg" && rm "$f") || true; done
          R="run-${GITHUB_RUN_ID}/leg${LEG}"; B="e2e/one-table-results"
          for repo in "$APP_REPO" "$SPACE_REPO"; do
            for n in PRIVATE_REPO_TOKEN MULTISPACE_REPO_TOKEN NEXORA_REPO_TOKEN; do
              v="${!n}"; [ -n "$v" ] || continue
              U="https://x-access-token:$v@github.com/$repo.git"
              git ls-remote "$U" >/dev/null 2>&1 || continue
              D="$RUNNER_TEMP/res-$RANDOM"
              git clone -q --depth 1 --branch "$B" "$U" "$D" 2>/dev/null || { git init -q "$D"; git -C "$D" checkout -q -b "$B"; git -C "$D" remote add origin "$U"; }
              mkdir -p "$D/$R"; cp -r . "$D/$R/"
              ok=1; (cd "$D" && git add -A && git -c user.name=rummy-table -c user.email=e2e@localhost commit -q -m "Rummy one-table run $GITHUB_RUN_ID leg $LEG") || ok=0
              # The legs push at about the same time: on a refused push, the branch is taken again and the push tried again.
              for try in 1 2 3 4 5; do
                [ "$ok" = 1 ] || break
                (cd "$D" && git push -q origin "HEAD:$B" >/dev/null 2>&1) && { ok=2; break; }
                sleep $((RANDOM % 10 + 3)); (cd "$D" && git pull -q --rebase origin "$B" >/dev/null 2>&1) || true
              done
              if [ "$ok" = 2 ]; then
                echo "Results: $repo (read with $n), branch $B, folder $R (private)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
              fi
            done
          done
          echo "::warning::the results could not be saved to a private repository"
      - name: Fail if a check failed
        if: env.RC != '0'
        run: exit 1
