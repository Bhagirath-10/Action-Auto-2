name: Hisaabo APK

# Builds the Hisaabo Android app from the PRIVATE repository 4BornGithub/Hisaabo
# and publishes the APK as a (pre-)release in that private repository.
#
# This repository is public, so:
#   - the APK is NOT uploaded as an artifact here (public artifacts can be downloaded);
#   - nothing from the private repository is printed beyond normal build output;
#   - all credentials come from repository secrets (masked in logs).
#
# Secrets (Settings → Secrets and variables → Actions):
#   HISAABO_REPO_TOKEN        fine-grained token, repository 4BornGithub/Hisaabo only,
#                             permission "Contents: Read and write" (checkout + release upload)
#   HISAABO_KEYSTORE_B64      release keystore, base64 (see docs/DEPLOYMENT_AUTOMATION.md in Hisaabo)
#   HISAABO_KEYSTORE_PASSWORD
#   HISAABO_KEY_ALIAS
#   HISAABO_KEY_PASSWORD
# Variable (optional): HISAABO_API_URL   default https://hisaabo.synoventum.us.cc
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Hisaabo branch, tag or commit to build"
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: hisaabo-apk
  cancel-in-progress: false

env:
  PRIVATE_REPO: 4BornGithub/Hisaabo
  API_URL: ${{ vars.HISAABO_API_URL || 'https://hisaabo.synoventum.us.cc' }}
  # No tool telemetry from the build machine
  DO_NOT_TRACK: "1"
  EXPO_NO_TELEMETRY: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  apk:
    name: build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the secrets
        env:
          T: ${{ secrets.HISAABO_REPO_TOKEN }}
          K: ${{ secrets.HISAABO_KEYSTORE_B64 }}
          KP: ${{ secrets.HISAABO_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.HISAABO_KEY_ALIAS }}
          KK: ${{ secrets.HISAABO_KEY_PASSWORD }}
        run: |
          missing=0
          for v in T K KP KA KK; do [ -n "${!v}" ] || { echo "::error::A required HISAABO_* secret is missing ($v)"; missing=1; }; done
          case "$API_URL" in https://*) ;; *) echo "::error::HISAABO_API_URL must start with https://"; missing=1;; esac
          exit $missing

      - name: Check out the private repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.HISAABO_REPO_TOKEN }}
          path: hisaabo
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: hisaabo/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: hisaabo
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Expo prebuild (native Android project)
        working-directory: hisaabo/apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Restore the release keystore
        working-directory: hisaabo/apps/mobile/android
        env:
          K: ${{ secrets.HISAABO_KEYSTORE_B64 }}
        run: |
          umask 077
          echo "$K" | base64 -d > release.keystore

      - name: Build release APK
        working-directory: hisaabo/apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ env.API_URL }}
          KP: ${{ secrets.HISAABO_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.HISAABO_KEY_ALIAS }}
          KK: ${{ secrets.HISAABO_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --quiet \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$KP" \
            -Pandroid.injected.signing.key.alias="$KA" \
            -Pandroid.injected.signing.key.password="$KK"
          rm -f release.keystore

      - name: Publish APK as a release in the private repository
        working-directory: hisaabo
        env:
          GH_TOKEN: ${{ secrets.HISAABO_REPO_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short HEAD)
          version=$(node -p "require('./apps/mobile/package.json').version")
          tag="apk-v${version}-${sha}-$(date -u +%Y%m%d%H%M)"
          apk="hisaabo-${version}-${sha}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$apk"
          gh release create "$tag" "$RUNNER_TEMP/$apk" \
            --repo "$PRIVATE_REPO" --target "$(git rev-parse HEAD)" --prerelease \
            --title "Android APK ${version} (${sha})" \
            --notes "Built by the public helper workflow. API: ${API_URL}"
          echo "Published release ${tag} in the private repository."

      - name: Remove the build tree
        if: always()
        run: rm -rf hisaabo
