name: Nexora AI - build and end-to-end test on an emulator

# Builds the Nexora AI app (private repository 4BornGithub/Nexora_AI) and runs it on an Android
# emulator against the backend (private repository Bhagirath-10/Game-Auto-2, folder backend,
# started on this machine). Nothing of the test is public: screenshots and logs go to branch
# "results" of the app's private repository, and this log shows only PASS / FAIL lines.
# Runs when nexora-e2e.txt changes; its first line is
#   "<app branch> <backend branch> <what: access | build | e2e>".
# Secret needed: one token that can read both private repositories (NEXORA_REPO_TOKEN,
# or PRIVATE_REPO_TOKEN / MULTISPACE_REPO_TOKEN if they can).

on:
  push:
    branches: [ci]
    paths:
      - nexora-e2e.txt
      - .github/workflows/nexora-e2e.yml

permissions:
  contents: read

env:
  APP_REPO: 4BornGithub/Nexora_AI
  BACKEND_REPO: Bhagirath-10/Game-Auto-2

jobs:
  access:
    name: access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_token: ${{ steps.pick.outputs.app }}
      backend_token: ${{ steps.pick.outputs.backend }}
      app_ref: ${{ steps.what.outputs.app_ref }}
      backend_ref: ${{ steps.what.outputs.backend_ref }}
      what: ${{ steps.what.outputs.what }}
    steps:
      - uses: actions/checkout@v4
      - name: What to test
        id: what
        run: |
          read -r APP BACKEND WHAT < nexora-e2e.txt
          echo "app_ref=$APP" >> "$GITHUB_OUTPUT"; echo "backend_ref=$BACKEND" >> "$GITHUB_OUTPUT"; echo "what=${WHAT:-access}" >> "$GITHUB_OUTPUT"
      # Only the names of the secrets are printed, never a token.
      - name: Pick a token for each private repository
        id: pick
        env:
          NEXORA_REPO_TOKEN: ${{ secrets.NEXORA_REPO_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
        run: |
          pick() { # $1 = output name, $2 = repository
            for n in NEXORA_REPO_TOKEN PRIVATE_REPO_TOKEN MULTISPACE_REPO_TOKEN; do
              v="${!n}"
              if [ -z "$v" ]; then echo "$2: $n is not set"; continue; fi
              if git ls-remote "https://x-access-token:$v@github.com/$2.git" >/dev/null 2>&1; then
                echo "$2: using $n" | tee -a "$GITHUB_STEP_SUMMARY"; echo "$1=$n" >> "$GITHUB_OUTPUT"; return 0
              fi
              case "$v" in github_pat_*) KIND="fine-grained";; ghp_*) KIND="classic";; *) KIND="unknown kind";; esac
              R=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $v" "https://api.github.com/repos/$2" || true)
              echo "$2: $n is set ($KIND) but cannot read it (GitHub answers $R)"
            done
            echo "$2: NO TOKEN CAN READ IT" | tee -a "$GITHUB_STEP_SUMMARY"; return 1
          }
          A=0; pick app "$APP_REPO" || A=1
          B=0; pick backend "$BACKEND_REPO" || B=1
          if [ $A = 1 ] || [ $B = 1 ]; then
            echo "::error::A token secret is missing. Add NEXORA_REPO_TOKEN to this repository: a fine-grained token with Contents read and write on $APP_REPO and Contents read on $BACKEND_REPO."; exit 1
          fi
