name: Chat widget probe (WeReplyX, phone-sized browser)

# Opens the WeReplyX website chat widget (bot id from chat-widget.txt) in a phone-sized Chromium page, as the
# Nexora AI app's Chat tab will (a WebView with the same one-line script): saves the widget's script, the
# network calls it makes, the page's elements and screenshots (bubble, then opened) to the private repository.
# No app is built. Secret: MULTISPACE_REPO_TOKEN or PRIVATE_REPO_TOKEN.

on:
  push:
    branches: [claude/gracious-pasteur-xvuoe4]
    paths:
      - chat-widget.txt
      - .github/workflows/chat-widget-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe
        run: |
          read -r BOT DOMAIN _ < chat-widget.txt; DOMAIN="${DOMAIN:-example.com}"; echo "$DOMAIN" | grep -Eq '^[a-z0-9.-]{3,60}$' || exit 1
          echo "$BOT" | grep -Eq '^[A-Za-z0-9]{3,20}$' || { echo "::error::bad bot id"; exit 1; }
          O="$RUNNER_TEMP/out"; mkdir -p "$O"
          curl -sS -m 30 -A "Mozilla/5.0 (Linux; Android 14) Chrome/124 Mobile" https://apis.wereplyx.com/widget.js -o "$O/widget.js" -w "widget.js: HTTP %{http_code}, %{size_download} bytes\n" || true
          curl -sS -m 30 -A "Mozilla/5.0 (Linux; Android 14) Chrome/124 Mobile" "https://apis.wereplyx.com/widget/chat.js?v=607a6d6679bc" -o "$O/chat.js" -w "chat.js: HTTP %{http_code}, %{size_download} bytes\n" || true
          mkdir -p "$RUNNER_TEMP/p" && cd "$RUNNER_TEMP/p"
          npm init -y >/dev/null && npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          # The page as the Nexora AI app writes it (ChatFragment.page()), in each colour set to compare.
          page() { cat <<HTML
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
          <style>html,body{margin:0;height:100%;background:#FFFFFF}.wereply-launcher{opacity:0!important}</style></head><body>
          <script src="https://apis.wereplyx.com/widget.js" data-bot-id="$BOT" $1 defer></script>
          <script>
          (function(){var said=false;function tick(){var c=document.getElementById('wereply-widget-container'),b=document.querySelector('.wereply-launcher');var open=c&&c.style.display!=='none';if(b&&!open){b.click();}if(open&&!said){said=true;console.log('[nexora] chat open');}}setInterval(tick,400);})();
          </script></body></html>
          HTML
          }
          page 'data-primary-color="#0D221B" data-secondary-color="#FFFFFF" data-user-bubble-color="#B8D547" data-bot-bubble-color="#EEF5D2"' > forest.html
          page 'data-primary-color="#B8D547" data-secondary-color="#0D221B" data-user-bubble-color="#B8D547" data-bot-bubble-color="#EEF5D2"' > lime.html
          cat > probe.js <<'JS'
          const { chromium, devices } = require('playwright');
          const fs = require('fs'); const O = process.env.O; const D = process.env.DOMAIN;
          const log = []; const L = (s) => { log.push(s); console.log(s.slice(0, 160)); };
          const QUESTIONS = (process.env.QUESTIONS || '').split('|').filter(Boolean);
          async function chatFrame(p) { for (let i = 0; i < 40; i++) { const f = p.frames().find(f => f.url().includes('/bot/')); if (f) return f; await p.waitForTimeout(500); } return null; }
          async function shot(p, n) { await p.screenshot({ path: `${O}/${n}.png` }); }
          async function text(f) { try { return (await f.evaluate(() => document.body.innerText)).replace(/\n{2,}/g, '\n'); } catch (e) { return 'ERR ' + e; } }
          (async () => {
            const b = await chromium.launch();
            for (const theme of ['forest']) {
              const ctx = await b.newContext({ ...devices['Pixel 7'] }); const p = await ctx.newPage();
              p.on('console', m => L(`${theme} console: ${m.text().slice(0, 200)}`));
              await p.route(`https://${D}/app-chat`, r => r.fulfill({ contentType: 'text/html', body: fs.readFileSync(`${theme}.html`, 'utf8') }));
              await p.goto(`https://${D}/app-chat`); await p.waitForTimeout(9000);
              await shot(p, `${theme}_1_home`);
              if (theme !== 'forest') { await ctx.close(); continue; }
              const f = await chatFrame(p); if (!f) { L('no chat frame'); await ctx.close(); continue; }
              fs.writeFileSync(`${O}/frame_home.html`, await f.content());
              const nc = f.getByText(/new conversation/i).first();
              if (await nc.count()) { await nc.click(); await p.waitForTimeout(3000); }
              await shot(p, 'forest_2_after_new'); fs.writeFileSync(`${O}/frame_form.html`, await f.content());
              L('AFTER NEW: ' + await text(f));
              const inputs = await f.$$('input:not([type=hidden]):not([type=checkbox]):not([type=radio]), textarea, select');
              for (const el of inputs) {
                const d = await el.evaluate(e => ({ tag: e.tagName, type: e.type, name: e.name, ph: e.placeholder, id: e.id, label: (e.labels && e.labels[0] ? e.labels[0].innerText : ''), visible: !!(e.offsetWidth || e.offsetHeight) }));
                L('FIELD ' + JSON.stringify(d)); if (!d.visible) continue;
                const k = (d.type + ' ' + d.name + ' ' + d.ph + ' ' + d.id + ' ' + d.label).toLowerCase();
                let v = null;
                if (/mail/.test(k)) v = 'nexora.test@example.com';
                else if (/phone|mobile|tel|whatsapp|number/.test(k)) v = '98250 33445';
                else if (/name/.test(k)) v = 'Nexora Test';
                else if (/company|business|org/.test(k)) v = 'Nexora AI (test)';
                if (v && d.tag !== 'SELECT') { await el.click(); await el.fill(''); await el.type(v, { delay: 40 }); await el.dispatchEvent('change'); await el.evaluate(e => e.blur()); L(`FILLED ${k.trim()} = ${v} -> value now: ${await el.inputValue()}`); }
              }
              await shot(p, 'forest_3_form_filled');
              const go = f.locator('button:visible, [role=button]:visible').filter({ hasText: /start|submit|continue|next|chat|send|begin/i }).first();
              if (await go.count()) { L('CLICK ' + (await go.innerText()).slice(0, 40)); await go.click(); await p.waitForTimeout(4000); }
              await shot(p, 'forest_4_after_form'); L('AFTER FORM: ' + await text(f));
              fs.writeFileSync(`${O}/frame_chat.html`, await f.content());
              let n = 5;
              for (const q of QUESTIONS) {
                const box = f.locator('textarea:visible, input[type=text]:visible, [contenteditable=true]:visible').last();
                if (!(await box.count())) { L('NO MESSAGE BOX for: ' + q); break; }
                const before = await text(f);
                await box.click(); await box.fill(q); await p.keyboard.press('Enter'); L('ASKED: ' + q);
                let after = before;
                for (let i = 0; i < 45; i++) { await p.waitForTimeout(1000); after = await text(f); if (after.length > before.length + q.length + 15 && !/typing|\.\.\.$/i.test(after.slice(-40))) { await p.waitForTimeout(2500); after = await text(f); break; } }
                L('REPLY AREA after "' + q + '":\n' + after.slice(Math.max(0, before.length - 20)));
                await shot(p, `forest_${n++}_q`);
              }
              L('FULL TRANSCRIPT:\n' + await text(f));
              await ctx.close();
            }
            fs.writeFileSync(`${O}/conversation.txt`, log.join('\n')); await b.close();
          })();
          JS
          (python3 -m http.server 8080 >/dev/null 2>&1 &) ; sleep 2
          O="$O" DOMAIN="$DOMAIN" QUESTIONS="Hello|Do you support Hindi?" node probe.js || echo "probe failed"
          ls -la "$O"
      - name: Save to the private repository
        if: always()
        env:
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          T="${MULTISPACE_REPO_TOKEN:-$PRIVATE_REPO_TOKEN}"; B=claude/gracious-pasteur-xvuoe4-e2e-results
          D="$RUNNER_TEMP/res"; git clone -q --depth 1 --branch "$B" "https://x-access-token:$T@github.com/4BornGithub/4B-Multi-Space.git" "$D" 2>&1 | grep -v -i token || true
          R="chat-widget-${GITHUB_RUN_ID}"; mkdir -p "$D/$R"; cp -r "$RUNNER_TEMP/out/." "$D/$R/"
          cd "$D" && git add -A && git -c user.name=chat-probe -c user.email=ci@localhost commit -q -m "Chat widget probe $GITHUB_RUN_ID" && git push -q origin "HEAD:$B" 2>&1 | grep -v -i "token\|x-access" || true
          echo "Saved: $B/$R" | tee -a "$GITHUB_STEP_SUMMARY"
